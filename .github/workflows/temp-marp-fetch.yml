name: Temporary MARP Bubble Bobble Fetch

on:
  push:
    branches:
      - temp-fbneo-runtime-20260802
    paths:
      - '.github/workflows/temp-marp-fetch.yml'

permissions:
  contents: write

jobs:
  fetch-marp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record run id first
        run: |
          mkdir -p .runtime
          printf '%s\n' '${{ github.run_id }}' > .runtime/marp-run-id.txt
          git config user.name 'temporary-marp-fetch'
          git config user.email 'actions@users.noreply.github.com'
          git add .runtime/marp-run-id.txt
          git commit -m 'Record temporary MARP fetch run id' || true
          git push origin HEAD:temp-fbneo-runtime-20260802
      - name: Fetch Bubble Bobble replay listing and linked archives
        run: |
          set -uxo pipefail
          mkdir -p marp
          urls=(
            'http://replay.marpirc.net/index.cgi?mode=frames_search&short=%5Ebublbobl$&table=y&per_game=1000&tourn=0&maxlines=9999'
            'https://replay.marpirc.net/index.cgi?mode=frames_search&short=%5Ebublbobl$&table=y&per_game=1000&tourn=0&maxlines=9999'
            'http://replay.marpirc.net/index.cgi?mode=search&short=bublbobl'
            'https://replay.marpirc.net/index.cgi?mode=search&short=bublbobl'
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            curl -k -A 'Mozilla/5.0' -L --retry 3 --retry-delay 2 "$url" -o "marp/listing_${n}.html" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re
          links=[]
          for p in Path('marp').glob('listing_*.html'):
              html=p.read_text(errors='replace')
              for q,u in re.findall(r'href=(?:"([^"]+)"|\'([^\']+)\')', html, flags=re.I):
                  u=q or u
                  full=urljoin('http://replay.marpirc.net/',u)
                  if 'bublbobl' in full.lower() or any(x in full.lower() for x in ('.zip','.inp','download','getfile','fetch','getinp','getreplay')):
                      links.append(full)
          links=list(dict.fromkeys(links))
          Path('marp/links.txt').write_text('\n'.join(links)+'\n')
          print('\n'.join(links))
          PY
          i=0
          while IFS= read -r link; do
            [ -n "$link" ] || continue
            i=$((i+1))
            curl -k -A 'Mozilla/5.0' -L --retry 3 --retry-delay 2 "$link" -o "marp/file_${i}" || true
          done < marp/links.txt
          file marp/* > marp/files.txt || true
          grep -RniE 'bublbobl|\.zip|\.inp|getinp|download' marp/listing_*.html > marp/grep.txt || true
          ls -lah marp
      - name: Upload MARP files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marp-bublbobl-files
          path: marp
          retention-days: 1
