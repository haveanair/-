name: Temporary MARP Bubble Bobble Fetch

on:
  push:
    branches:
      - temp-fbneo-runtime-20260802
    paths:
      - '.github/workflows/temp-marp-fetch.yml'

permissions:
  contents: write

jobs:
  fetch-marp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record run id first
        run: |
          mkdir -p .runtime
          printf '%s\n' '${{ github.run_id }}' > .runtime/marp-run-id.txt
          git config user.name 'temporary-marp-fetch'
          git config user.email 'actions@users.noreply.github.com'
          git add .runtime/marp-run-id.txt
          git commit -m 'Record temporary MARP fetch run id' || true
          git push origin HEAD:temp-fbneo-runtime-20260802
      - name: Fetch Bubble Bobble replay listing and linked archives
        run: |
          set -euxo pipefail
          mkdir -p marp
          url='https://replay.marpirc.net/index.cgi?mode=frames_search&short=%5Ebublbobl%24&table=y&per_game=1000&tourn=0&maxlines=9999'
          curl -A 'Mozilla/5.0' -L --fail --retry 5 --retry-delay 2 "$url" -o marp/listing.html
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import re
          html=Path('marp/listing.html').read_text(errors='replace')
          links=[]
          for q,u in re.findall(r'href=(?:"([^"]+)"|\'([^\']+)\')', html, flags=re.I):
              u=q or u
              full=urljoin('https://replay.marpirc.net/',u)
              if any(x in full.lower() for x in ('.zip','.inp','download','getfile','fetch')):
                  links.append(full)
          Path('marp/links.txt').write_text('\n'.join(dict.fromkeys(links))+'\n')
          print('\n'.join(dict.fromkeys(links)))
          PY
          i=0
          while IFS= read -r link; do
            [ -n "$link" ] || continue
            i=$((i+1))
            curl -A 'Mozilla/5.0' -L --fail --retry 3 --retry-delay 2 "$link" -o "marp/file_${i}" || true
          done < marp/links.txt
          file marp/* > marp/files.txt || true
          ls -lah marp
      - name: Upload MARP files
        uses: actions/upload-artifact@v4
        with:
          name: marp-bublbobl-files
          path: marp
          retention-days: 1
