name: Haptic Diagnostic APK

on:
  push:
    branches:
      - haptic-diagnostic-build-20260829
    paths:
      - 'hapticdiag/**'
      - '.github/workflows/hapticdiag-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p hapticdiag --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f hapticdiag/app/build/outputs/apk/debug/app-debug.apk
          ls -lh hapticdiag/app/build/outputs/apk/debug/app-debug.apk
          sha256sum hapticdiag/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: haptic-diagnostic-apk
          path: hapticdiag/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
