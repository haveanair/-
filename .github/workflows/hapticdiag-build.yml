name: Haptic Diagnostic Transfer

on:
  push:
    branches:
      - haptic-diagnostic-build-20260829
    paths:
      - '.github/workflows/hapticdiag-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: haptic-diagnostic-build-20260829

      - name: Split remaining APK base64 into small chunks
        run: |
          mkdir -p hapticdiag/dist/small04 hapticdiag/dist/small05
          rm -f hapticdiag/dist/small04/* hapticdiag/dist/small05/*
          split -b 1000 -d -a 2 hapticdiag/dist/chunks/part_04 hapticdiag/dist/small04/p_
          split -b 1000 -d -a 2 hapticdiag/dist/chunks/part_05 hapticdiag/dist/small05/p_
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hapticdiag/dist/small04 hapticdiag/dist/small05
          git commit -m 'hapticdiag: split final transfer chunks' || true
          git push origin HEAD:haptic-diagnostic-build-20260829
