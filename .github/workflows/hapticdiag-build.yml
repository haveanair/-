name: Haptic Diagnostic APK

on:
  push:
    branches:
      - haptic-diagnostic-build-20260829
    paths:
      - 'hapticdiag/settings.gradle'
      - 'hapticdiag/build.gradle'
      - 'hapticdiag/app/**'
      - '.github/workflows/hapticdiag-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: haptic-diagnostic-build-20260829

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p hapticdiag --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f hapticdiag/app/build/outputs/apk/debug/app-debug.apk
          ls -lh hapticdiag/app/build/outputs/apk/debug/app-debug.apk
          sha256sum hapticdiag/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK and transfer chunks to branch
        run: |
          mkdir -p hapticdiag/dist/chunks
          cp hapticdiag/app/build/outputs/apk/debug/app-debug.apk 'hapticdiag/dist/어서오소_Android_네이티브진동_진단.apk'
          base64 -w0 hapticdiag/app/build/outputs/apk/debug/app-debug.apk > hapticdiag/dist/apk.b64
          rm -f hapticdiag/dist/chunks/part_*
          split -b 3000 -d -a 2 hapticdiag/dist/apk.b64 hapticdiag/dist/chunks/part_
          sha256sum hapticdiag/app/build/outputs/apk/debug/app-debug.apk > hapticdiag/dist/SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hapticdiag/dist
          git commit -m 'hapticdiag: publish APK transfer chunks' || true
          git push origin HEAD:haptic-diagnostic-build-20260829
