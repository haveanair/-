name: Temporary FBNeo Runtime Fetch

on:
  push:
    branches:
      - temp-fbneo-runtime-20260802
    paths-ignore:
      - '.runtime/fbneo-run-id.txt'

permissions:
  contents: write

jobs:
  fetch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official FBNeo and SDL2_image runtime
        run: |
          set -euxo pipefail
          mkdir -p runtime-bundle
          curl -L --fail --retry 5 --retry-delay 2 \
            -o runtime-bundle/linux-sdl2-x86_64.zip \
            https://github.com/finalburnneo/FBNeo/releases/download/latest/linux-sdl2-x86_64.zip
          unzip -t runtime-bundle/linux-sdl2-x86_64.zip
          sudo apt-get update
          cd /tmp
          apt-get download libsdl2-image-2.0-0
          dpkg-deb -x libsdl2-image-2.0-0_*.deb "$GITHUB_WORKSPACE/runtime-bundle/sdl2-image"
          find "$GITHUB_WORKSPACE/runtime-bundle" -type f -o -type l
      - name: Upload complete runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: fbneo-linux-runtime-complete
          path: runtime-bundle
          retention-days: 1
      - name: Record workflow run id
        run: |
          mkdir -p .runtime
          printf '%s\n' '${{ github.run_id }}' > .runtime/fbneo-run-id.txt
          git config user.name 'temporary-runtime-fetch'
          git config user.email 'actions@users.noreply.github.com'
          git add .runtime/fbneo-run-id.txt
          git commit -m 'Record temporary FBNeo runtime run id' || exit 0
          git push origin HEAD:temp-fbneo-runtime-20260802
