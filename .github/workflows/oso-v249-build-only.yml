name: Oso v249 Chunk Export
on:
  push:
    branches: [oso-v249-android-final]
permissions:
  contents: write
jobs:
  chunk:
    if: ${{ !contains(github.event.head_commit.message, '[chunk-export]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split existing Gradle APK base64 files
        run: |
          set -eux
          rm -rf oso-v249-final/chunks
          mkdir -p oso-v249-final/chunks/live oso-v249-final/chunks/unlocked
          split -b 2800 -d -a 2 oso-v249-final/shell-export/live.apk.b64 oso-v249-final/chunks/live/part-
          split -b 2800 -d -a 2 oso-v249-final/shell-export/unlocked.apk.b64 oso-v249-final/chunks/unlocked/part-
          git config user.name 'PWDJ Android Builder'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add oso-v249-final/chunks
          git commit -m '[chunk-export] split Gradle APK base64'
          git push origin HEAD:oso-v249-android-final
