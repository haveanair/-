name: Oso v249 Android Build Export

on:
  push:
    branches: [oso-v249-android-final]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[apk-export]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APKs with Android Gradle Plugin
        working-directory: oso-v249-final
        run: gradle --no-daemon :live:assembleRelease :unlocked:assembleRelease
      - name: Export APKs as wrapped base64 text into branch
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p oso-v249-final/export
          base64 oso-v249-final/live/build/outputs/apk/release/live-release-unsigned.apk > oso-v249-final/export/live-release-unsigned.apk.b64
          base64 oso-v249-final/unlocked/build/outputs/apk/release/unlocked-release-unsigned.apk > oso-v249-final/export/unlocked-release-unsigned.apk.b64
          sha256sum oso-v249-final/live/build/outputs/apk/release/live-release-unsigned.apk oso-v249-final/unlocked/build/outputs/apk/release/unlocked-release-unsigned.apk > oso-v249-final/export/SHA256.txt
          git config user.name 'PWDJ Android Builder'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add oso-v249-final/export
          git commit -m '[apk-export] Oso v249 Gradle release APKs wrapped'
          git push origin HEAD:oso-v249-android-final
