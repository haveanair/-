name: Oso v249 Android Build Export

on:
  push:
    branches: [oso-v249-android-final]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APKs with Android Gradle Plugin
        working-directory: oso-v249-final
        run: gradle --no-daemon :live:assembleRelease :unlocked:assembleRelease
      - name: Print Gradle APK bases
        shell: bash
        run: |
          set -euo pipefail
          echo '===OSO_LIVE_APK_BASE64_BEGIN==='
          base64 -w0 oso-v249-final/live/build/outputs/apk/release/live-release-unsigned.apk
          echo
          echo '===OSO_LIVE_APK_BASE64_END==='
          echo '===OSO_UNLOCKED_APK_BASE64_BEGIN==='
          base64 -w0 oso-v249-final/unlocked/build/outputs/apk/release/unlocked-release-unsigned.apk
          echo
          echo '===OSO_UNLOCKED_APK_BASE64_END==='
          sha256sum oso-v249-final/live/build/outputs/apk/release/live-release-unsigned.apk oso-v249-final/unlocked/build/outputs/apk/release/unlocked-release-unsigned.apk
