name: Oso v249 Gradle APK Export Only

on:
  push:
    branches: [oso-v249-android-final]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed Gradle APK bases
        run: |
          test -f oso-v249-final/apk-bin/live-release-unsigned.apk
          test -f oso-v249-final/apk-bin/unlocked-release-unsigned.apk
          sha256sum oso-v249-final/apk-bin/*.apk
      - name: Upload only two small Gradle APK bases
        uses: actions/upload-artifact@v4
        with:
          name: oso-v249-gradle-apk-bases
          retention-days: 1
          compression-level: 0
          path: |
            oso-v249-final/apk-bin/live-release-unsigned.apk
            oso-v249-final/apk-bin/unlocked-release-unsigned.apk
