name: Build R14 Integrated Patcher

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Create generic patcher source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Encoding UTF8 src/R14Patcher.csproj
          @'
          using System.IO.Compression;
          using System.Security.Cryptography;
          using System.Text.Json;

          static class Program
          {
              const string StockSha = "34d067676ba77c9249010df0e49b1711597f1181cb51a52b8839c19e302ef3de";
              record Variant(string Label, string IpsZip, string Output);
              static readonly Dictionary<string,Variant> Variants = new()
              {
                  ["1"] = new("STANDARD", "Bubble_Bobble_KO_R14_FINAL_STANDARD_ORIGINAL_ROM_IPS.zip", "Bubble_Bobble_KO_R14_FINAL_STANDARD_bublbobl.zip"),
                  ["2"] = new("INVINCIBLE", "Bubble_Bobble_KO_R14_FINAL_INVINCIBLE_ORIGINAL_ROM_IPS.zip", "Bubble_Bobble_KO_R14_FINAL_INVINCIBLE_bublbobl.zip"),
                  ["3"] = new("ALL MODES", "Bubble_Bobble_KO_R14_FINAL_ALL_MODES_ORIGINAL_ROM_IPS.zip", "Bubble_Bobble_KO_R14_FINAL_ALL_MODES_bublbobl.zip"),
                  ["4"] = new("ALL MODES + INVINCIBLE", "Bubble_Bobble_KO_R14_FINAL_ALL_MODES_INVINCIBLE_ORIGINAL_ROM_IPS.zip", "Bubble_Bobble_KO_R14_FINAL_ALL_MODES_INVINCIBLE_bublbobl.zip")
              };

              static string Sha(byte[] b) => Convert.ToHexString(SHA256.HashData(b)).ToLowerInvariant();
              static byte[] ApplyIps(byte[] src, byte[] p)
              {
                  if (p.Length < 8 || System.Text.Encoding.ASCII.GetString(p,0,5) != "PATCH") throw new Exception("Invalid IPS header");
                  var output = src.ToList(); int i=5;
                  while (!(p[i]==0x45 && p[i+1]==0x4f && p[i+2]==0x46))
                  {
                      int off=(p[i]<<16)|(p[i+1]<<8)|p[i+2]; i+=3;
                      int len=(p[i]<<8)|p[i+1]; i+=2;
                      if (len==0)
                      {
                          int rle=(p[i]<<8)|p[i+1]; i+=2; byte v=p[i++];
                          while(output.Count < off+rle) output.Add(0);
                          for(int n=0;n<rle;n++) output[off+n]=v;
                      }
                      else
                      {
                          while(output.Count < off+len) output.Add(0);
                          for(int n=0;n<len;n++) output[off+n]=p[i+n];
                          i+=len;
                      }
                  }
                  return output.ToArray();
              }
              static byte[] ReadEntry(ZipArchiveEntry e)
              {
                  using var s=e.Open(); using var m=new MemoryStream(); s.CopyTo(m); return m.ToArray();
              }
              static int Main(string[] args)
              {
                  try
                  {
                      Console.OutputEncoding=System.Text.Encoding.UTF8;
                      string input = args.Length>0 ? args[0].Trim('"') : "";
                      if (string.IsNullOrWhiteSpace(input)) { Console.Write("순정 bublbobl.zip 경로: "); input=(Console.ReadLine()??"").Trim('"'); }
                      if (!File.Exists(input)) throw new Exception("입력 ZIP을 찾을 수 없습니다.");
                      string got=Sha(File.ReadAllBytes(input));
                      if (got!=StockSha) throw new Exception($"순정 bublbobl.zip SHA-256 불일치\n필요: {StockSha}\n입력: {got}");
                      Console.WriteLine("1. 일반판"); Console.WriteLine("2. 무적판"); Console.WriteLine("3. 3모드 일반판 (Original + Power-Up + Super)"); Console.WriteLine("4. 3모드 무적판");
                      Console.Write("선택 [1-4]: "); string sel=(Console.ReadLine()??"").Trim();
                      if(!Variants.TryGetValue(sel,out var v)) throw new Exception("잘못된 선택입니다.");
                      string baseDir=AppContext.BaseDirectory; string ipsPath=Path.Combine(baseDir,v.IpsZip);
                      if(!File.Exists(ipsPath)) throw new Exception("패치 파일이 없습니다: "+v.IpsZip);
                      var members=new Dictionary<string,byte[]>(); var order=new List<string>();
                      using(var zin=ZipFile.OpenRead(input)) foreach(var e in zin.Entries) { if(string.IsNullOrEmpty(e.Name)) continue; order.Add(e.FullName); members[e.FullName]=ReadEntry(e); }
                      using(var pz=ZipFile.OpenRead(ipsPath))
                      {
                          var man=pz.GetEntry("MANIFEST.json") ?? throw new Exception("MANIFEST.json 누락");
                          using var doc=JsonDocument.Parse(ReadEntry(man));
                          foreach(var e in pz.Entries)
                          {
                              if(!e.FullName.EndsWith(".ips",StringComparison.OrdinalIgnoreCase)) continue;
                              string n=e.FullName[..^4]; if(!members.ContainsKey(n)) throw new Exception("ROM 멤버 누락: "+n);
                              members[n]=ApplyIps(members[n],ReadEntry(e));
                          }
                          var mm=doc.RootElement.GetProperty("members");
                          foreach(var prop in mm.EnumerateObject())
                          {
                              string n=prop.Name; string h=prop.Value.GetProperty("target_sha256").GetString()!;
                              if(!members.TryGetValue(n,out var b) || Sha(b)!=h) throw new Exception("결과 검증 실패: "+n);
                          }
                      }
                      string outPath=Path.Combine(Path.GetDirectoryName(Path.GetFullPath(input))!,v.Output); if(File.Exists(outPath)) File.Delete(outPath);
                      using(var zo=ZipFile.Open(outPath,ZipArchiveMode.Create)) foreach(string n in order) { var e=zo.CreateEntry(n,CompressionLevel.Optimal); using var s=e.Open(); s.Write(members[n]); }
                      Console.ForegroundColor=ConsoleColor.Green; Console.WriteLine("완료: "+v.Label); Console.ResetColor(); Console.WriteLine(outPath); return 0;
                  }
                  catch(Exception ex) { Console.ForegroundColor=ConsoleColor.Red; Console.Error.WriteLine("오류: "+ex.Message); Console.ResetColor(); return 1; }
              }
          }
          '@ | Set-Content -Encoding UTF8 src/Program.cs
      - name: Publish Windows x64 single-file EXE
        shell: pwsh
        run: dotnet publish src/R14Patcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Rename
        shell: pwsh
        run: Move-Item publish/R14Patcher.exe publish/Bubble_Bobble_KO_R14_Integrated_Patcher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Bubble_Bobble_KO_R14_Integrated_Patcher_Win64
          path: publish/Bubble_Bobble_KO_R14_Integrated_Patcher.exe
          retention-days: 1
