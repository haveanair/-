name: Jinju v234 Android Shell

on:
  push:
    branches: [ jinju-app-v234 ]
    paths-ignore:
      - 'jinju_shell_v234/dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jinju-app-v234
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build shell
        run: gradle -p jinju_shell_v234 --no-daemon --stacktrace assembleDebug
      - name: Make unsigned shell base
        run: |
          rm -rf /tmp/jinju-shell && mkdir -p /tmp/jinju-shell
          cd /tmp/jinju-shell
          unzip -q "$GITHUB_WORKSPACE/jinju_shell_v234/app/build/outputs/apk/debug/app-debug.apk"
          rm -rf META-INF assets
          zip -q -0 -r "$GITHUB_WORKSPACE/shell-base.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -t shell-base.zip
          ls -lh shell-base.zip
          mkdir -p jinju_shell_v234/dist
          cp shell-base.zip jinju_shell_v234/dist/shell-base.zip
      - name: Publish shell base to branch
        run: |
          git config user.name 'PWDJ Build Bot'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add jinju_shell_v234/dist/shell-base.zip
          git diff --cached --quiet && exit 0
          git commit -m 'jinju v234: publish compiled shell base'
          git push origin HEAD:jinju-app-v234
