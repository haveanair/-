name: Temporary MAME 0.288 Linux Fetch

on:
  push:
    branches:
      - temp-fbneo-runtime-20260802
    paths:
      - '.github/workflows/temp-mame288-fetch.yml'

permissions:
  contents: write

jobs:
  fetch-mame288:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record run id first
        run: |
          mkdir -p .runtime
          printf '%s\n' '${{ github.run_id }}' > .runtime/mame288-run-id.txt
          git config user.name 'temporary-mame-fetch'
          git config user.email 'actions@users.noreply.github.com'
          git add .runtime/mame288-run-id.txt
          git commit -m 'Record temporary MAME 0.288 run id' || true
          git push origin HEAD:temp-fbneo-runtime-20260802
      - name: Install and bundle MAME 0.288 for Ubuntu 24.04
        run: |
          set -euxo pipefail
          sudo add-apt-repository -y ppa:c.falco/mame
          sudo apt-get update
          sudo apt-get install -y mame mame-data
          wrapper=/usr/games/mame
          realbin=/usr/lib/mame/mame
          file "$wrapper" "$realbin"
          sed -n '1,80p' "$wrapper" || true
          "$wrapper" -version
          "$realbin" -version
          mkdir -p mame288/root/usr/games mame288/root/usr/share/games mame288/root/usr/lib mame288/root/lib mame288/root/lib64
          cp -a "$wrapper" mame288/root/usr/games/
          cp -a /usr/lib/mame mame288/root/usr/lib/
          cp -a /usr/share/games/mame mame288/root/usr/share/games/
          ldd "$realbin" | tee mame288/ldd.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess
          root=Path('mame288/root')
          realbin='/usr/lib/mame/mame'
          out=subprocess.check_output(['ldd',realbin], text=True)
          paths=set(re.findall(r'(/[^\s()]+)', out))
          paths.add('/lib64/ld-linux-x86-64.so.2')
          for s in sorted(paths):
              p=Path(s)
              if not p.exists():
                  continue
              dst=root / p.relative_to('/')
              dst.parent.mkdir(parents=True, exist_ok=True)
              target=p.resolve()
              realdst=root / target.relative_to('/')
              realdst.parent.mkdir(parents=True, exist_ok=True)
              if not realdst.exists():
                  shutil.copy2(target,realdst)
              if p.is_symlink():
                  if dst.exists() or dst.is_symlink(): dst.unlink()
                  rel=Path(shutil.os.path.relpath(realdst, dst.parent))
                  dst.symlink_to(rel)
              elif dst != realdst and not dst.exists():
                  shutil.copy2(p,dst)
          PY
          find mame288/root -type f -o -type l | sort > mame288/files.txt
          du -sh mame288/root
      - name: Upload MAME 0.288
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mame-0.288-linux
          path: mame288
          retention-days: 1
