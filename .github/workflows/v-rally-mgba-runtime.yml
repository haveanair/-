name: v-rally-mgba-runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-libretro:
    runs-on: ubuntu-22.04
    steps:
      - name: Build minimal official mGBA 0.10.5 libretro core
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 0.10.5 https://github.com/mgba-emu/mgba.git src
          cmake -S src -B build \
            -DBUILD_LIBRETRO=ON \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=OFF \
            -DDISABLE_FRONTENDS=ON \
            -DUSE_FFMPEG=OFF \
            -DUSE_LUA=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_SQLITE3=OFF \
            -DUSE_ELF=OFF \
            -DUSE_LIBZIP=OFF \
            -DUSE_LZMA=OFF \
            -DCMAKE_BUILD_TYPE=MinSizeRel
          cmake --build build -j2
          echo '--- libretro candidates ---'
          find build -type f -name '*libretro*.so' -o -name '*mgba*.so' | xargs -r ls -l
          CORE=$(find build -type f -name '*libretro*.so' | head -1)
          test -n "$CORE"
          file "$CORE"
          ldd "$CORE" || true
          cp "$CORE" mgba_libretro.so
          xz -9 -k mgba_libretro.so
          echo '--- sizes ---'
          stat -c '%s %n' mgba_libretro.so mgba_libretro.so.xz
          sha256sum mgba_libretro.so mgba_libretro.so.xz
