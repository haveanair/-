name: v-rally-mgba-runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  artifact-transfer:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Reassemble verified mGBA runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v-rally-mgba-trigger "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cat repo/.v-rally-runtime/minimal/chunk_* > minimal.b64
          base64 -d minimal.b64 > mgba_minimal.so.xz
          test "$(sha256sum mgba_minimal.so.xz | awk '{print $1}')" = "ba40fc443bdcf8e6ef12e50c5332a779014a9e44499d00bcb942d39ac6ad57d3"
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-rally-mgba-runtime
          path: mgba_minimal.so.xz
          compression-level: 0
          retention-days: 1
