name: v-rally-mgba-runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-mgba:
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch and inspect official mGBA 0.10.5 Ubuntu Jammy build
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o mGBA.tar.xz \
            https://github.com/mgba-emu/mgba/releases/download/0.10.5/mGBA-0.10.5-ubuntu64-jammy.tar.xz
          sha256sum mGBA.tar.xz
          mkdir mgba
          tar -xJf mGBA.tar.xz -C mgba
          echo '--- archive files ---'
          find mgba -type f -printf '%s %p\n' | sort -n
          echo '--- executables ---'
          find mgba -type f -perm -111 -print -exec file {} \;
          echo '--- ldd ---'
          while IFS= read -r f; do
            if file "$f" | grep -q 'ELF .* executable'; then
              echo "### $f"
              ldd "$f" || true
            fi
          done < <(find mgba -type f -perm -111 -print)
