name: v-rally-mgba-runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  stage-runtime-text:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wrap staged mGBA core as line-addressable base64
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" outrepo
          git -C outrepo checkout v-rally-mgba-trigger
          if git -C outrepo log -1 --pretty=%s | grep -q '^runtime-b64:'; then
            echo 'Wrapped runtime already staged.'
            exit 0
          fi
          SRC=outrepo/.v-rally-runtime/mgba_libretro.so.xz
          test -s "$SRC"
          base64 -w 76 "$SRC" > outrepo/.v-rally-runtime/mgba_libretro.so.xz.b64
          echo '--- transfer file ---'
          wc -l -c outrepo/.v-rally-runtime/mgba_libretro.so.xz.b64
          sha256sum "$SRC"
          git -C outrepo config user.name 'V-Rally verification bot'
          git -C outrepo config user.email 'actions@users.noreply.github.com'
          git -C outrepo add .v-rally-runtime/mgba_libretro.so.xz.b64
          if git -C outrepo diff --cached --quiet; then
            echo 'No transfer file change.'
          else
            git -C outrepo commit -m 'runtime-b64: wrap mGBA core for local verification'
            git -C outrepo push origin v-rally-mgba-trigger
          fi
