name: v-rally-mgba-runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve-runtime-host:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve temporary runtime host
        shell: bash
        run: |
          set -euo pipefail
          echo '--- tmpfiles.org IPv4 ---'
          getent ahostsv4 tmpfiles.org | head -10 || true
          echo '--- direct URL headers ---'
          curl -sSIL --max-time 10 https://tmpfiles.org/dl/wlw2CGkgPOpv/mgba_libretro.so.xz | head -30 || true
