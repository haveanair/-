name: v-rally-mgba-runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  upload-text-payload:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Upload verified mGBA core as plain base64 text
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v-rally-mgba-trigger "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo >/dev/null 2>&1
          cat repo/.v-rally-runtime/minimal/chunk_* > minimal_wrapped.b64
          base64 -d minimal_wrapped.b64 > mgba_minimal.so.xz
          test "$(stat -c %s mgba_minimal.so.xz)" = "254228"
          test "$(sha256sum mgba_minimal.so.xz | awk '{print $1}')" = "ba40fc443bdcf8e6ef12e50c5332a779014a9e44499d00bcb942d39ac6ad57d3"
          base64 -w 76 mgba_minimal.so.xz > mgba_minimal_base64.txt
          printf '\nSHA256_XZ=ba40fc443bdcf8e6ef12e50c5332a779014a9e44499d00bcb942d39ac6ad57d3\nSIZE_XZ=254228\n' >> mgba_minimal_base64.txt
          RESP=$(curl -sS -f -F "file=@mgba_minimal_base64.txt;type=text/plain" https://tmpfiles.org/api/v1/upload)
          echo "$RESP"
          URL=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["url"])' <<< "$RESP")
          DIRECT=${URL/https:\/\/tmpfiles.org\//https:\/\/tmpfiles.org\/dl\/}
          echo "TEXT_DIRECT_URL=$DIRECT"
