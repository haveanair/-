name: v-rally-mgba-runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  print-runtime:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Print staged verified mGBA core for local reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v-rally-mgba-trigger "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          SRC=repo/.v-rally-runtime/mgba_libretro.so.xz
          test -s "$SRC"
          echo "SHA256_XZ=$(sha256sum "$SRC" | awk '{print $1}')"
          echo 'MGBAXZ_B64_BEGIN'
          base64 -w 1000 "$SRC"
          echo 'MGBAXZ_B64_END'
