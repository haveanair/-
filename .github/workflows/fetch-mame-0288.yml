name: Fetch MAME 0.288 validation runtime

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:forky
    steps:
      - name: Install MAME 0.288
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mame mame-data ca-certificates tar gzip coreutils
          /usr/games/mame -version
      - name: Collect portable runtime
        run: |
          set -eux
          mkdir -p artifact/bin artifact/lib artifact/share artifact/etc
          cp /usr/lib/mame/mame artifact/bin/mame
          cp /usr/lib/mame/*.default artifact/etc/ || true
          ldd /usr/lib/mame/mame | awk '{for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u > /tmp/mame-libs.txt
          while read -r lib; do [ -n "$lib" ] && cp -L "$lib" artifact/lib/; done < /tmp/mame-libs.txt
          SDL3=$(find /usr/lib /lib -type f -name 'libSDL3.so*' 2>/dev/null | head -n 1 || true)
          if [ -n "$SDL3" ]; then
            cp -L "$SDL3" artifact/lib/
            ldd "$SDL3" | awk '{for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u > /tmp/sdl3-libs.txt
            while read -r lib; do [ -n "$lib" ] && cp -L "$lib" artifact/lib/; done < /tmp/sdl3-libs.txt
          fi
          for extra in /usr/lib/x86_64-linux-gnu/libdecor-0.so* /usr/lib/x86_64-linux-gnu/libdecor/plugins-1/*.so; do [ -e "$extra" ] && cp -L "$extra" artifact/lib/ || true; done
          if [ -d /usr/share/games/mame ]; then cp -a /usr/share/games/mame artifact/share/mame; fi
          printf '%s\n' '#!/bin/sh' 'DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' 'LOADER=$(find "$DIR/lib" -maxdepth 1 -name "ld-linux*.so*" | head -n 1)' 'if [ -n "$LOADER" ]; then exec "$LOADER" --library-path "$DIR/lib" "$DIR/bin/mame" "$@"; else LD_LIBRARY_PATH="$DIR/lib" exec "$DIR/bin/mame" "$@"; fi' > artifact/run-mame.sh
          chmod +x artifact/run-mame.sh
          (cd artifact && sha256sum bin/mame lib/* > SHA256SUMS.txt)
          tar -C artifact -czf mame-0.288-debian-forky-x86_64-portable.tar.gz .
          sha256sum mame-0.288-debian-forky-x86_64-portable.tar.gz > mame-0.288-debian-forky-x86_64-portable.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mame-0288-validation-linux-x64
          path: |
            mame-0.288-debian-forky-x86_64-portable.tar.gz
            mame-0.288-debian-forky-x86_64-portable.tar.gz.sha256
          retention-days: 1
