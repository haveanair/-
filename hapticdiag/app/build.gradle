plugins { id 'com.android.application' }

android {
    namespace 'com.powerduck.hapticdiag'
    compileSdk 35

    defaultConfig {
        applicationId 'com.powerduck.hapticdiag'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-native-haptic-diag'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
